name: 功能需求
description: 提出新功能或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下会用到？现在怎么做的、卡在哪？
      placeholder: 社团每周训练赛后需要导出成绩表发群里，现在只能在页面上一个个抄。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 希望做成什么样。有界面设想可以画草图或描述
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 判题（judge）
        - 考试（exam）
        - 题目管理（problem）
        - 用户与权限（user/auth）
        - 竞赛与排名（contest）
        - 管理端（admin）
        - 界面样式（ui）
        - 部署与数据库（docker/db）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 紧急程度
      options:
        - 阻塞日常使用，急需
        - 影响体验，希望尽快
        - 有更好，不急
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 补充说明
      description: 想过哪些别的做法？有无参考的其他 OJ 实现
